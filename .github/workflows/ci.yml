name: Nflake Guard — tests and local PostgreSQL smoke
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guard
          POSTGRES_PASSWORD: test-secret-only
          POSTGRES_DB: guard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guard -d guard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://guard:test-secret-only@127.0.0.1:5432/guard
      GUARD_ADMIN_TOKEN: ci-admin-token-not-for-real-use-at-least-32-characters
      GUARD_CONNECTOR_SECRET: ci-finance-connector-secret-at-least-32-characters
      GUARD_DRY_RUN: YES
      GUARD_VERIFIED_EVENTS_ENABLED: NO
      GUARD_HOST: 127.0.0.1
      GUARD_PORT: 4080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run migrate
      - run: node scripts/ci-smoke.mjs
